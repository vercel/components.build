name: Sync Skill Docs

on:
  push:
    branches: [main]
    paths:
      - 'content/docs/composition.mdx'
      - 'content/docs/as-child.mdx'
      - 'content/docs/polymorphism.mdx'
      - 'content/docs/data-attributes.mdx'
      - 'content/docs/state.mdx'
      - 'content/docs/styling.mdx'
      - 'content/docs/accessibility.mdx'
      - 'content/docs/types.mdx'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Copy and clean docs
        run: |
          SKILL_DIR=".claude/skills/building-components/references"

          # List of docs to sync
          DOCS=(
            "composition"
            "as-child"
            "polymorphism"
            "data-attributes"
            "state"
            "styling"
            "accessibility"
            "types"
          )

          for doc in "${DOCS[@]}"; do
            src="content/docs/${doc}.mdx"
            dest="${SKILL_DIR}/${doc}.mdx"

            if [ -f "$src" ]; then
              # Copy and strip MDX components that won't render
              sed -E '/<Video[^>]*\/>/d; /<[A-Z][a-zA-Z]*[^>]*\/>/d; /<[A-Z][a-zA-Z]*>.*<\/[A-Z][a-zA-Z]*>/d' "$src" > "$dest"
              echo "Synced: $doc"
            fi
          done

      - name: Check for changes
        id: changes
        run: |
          git add .claude/skills/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync skill docs from content/docs"
          git push
