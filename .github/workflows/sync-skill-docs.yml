name: Sync Skill Docs

on:
  push:
    branches: [main]
    paths:
      - 'content/docs/*.mdx'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Copy and clean docs
        run: |
          SKILL_DIR=".claude/skills/building-components/references"
          mkdir -p "$SKILL_DIR"

          # Find all non-localized .mdx files (exclude *.XX.mdx where XX is language code)
          for src in content/docs/*.mdx; do
            filename=$(basename "$src")

            # Skip localized files (pattern: name.XX.mdx where XX is 2-letter code)
            if [[ "$filename" =~ \.[a-z]{2}\.mdx$ ]]; then
              continue
            fi

            dest="${SKILL_DIR}/${filename}"

            # Copy and strip MDX components that won't render
            sed -E '/<Video[^>]*\/>/d; /<[A-Z][a-zA-Z]*[^>]*\/>/d; /<[A-Z][a-zA-Z]*>.*<\/[A-Z][a-zA-Z]*>/d' "$src" > "$dest"
            echo "Synced: $filename"
          done

      - name: Check for changes
        id: changes
        run: |
          git add .claude/skills/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync skill docs from content/docs"
          git push
